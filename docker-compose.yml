version: '3.8'
services:
  mongodb:
    image: mongo:7.0
    container_name: cybersentinel-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: cybersentinel

  backend:
    build: ./backend
    container_name: cybersentinel-backend
    ports:
      - "3000:3000"
    volumes:
      - ./suricata/eve.json:/var/log/suricata/eve.json
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/cybersentinel
      - EVE_JSON_PATH=/var/log/suricata/eve.json
      - EVE_MODE=real
      - FRONTEND_URL=http://localhost:5173
      - SEED_DB=true
    depends_on:
      - mongodb
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cybersentinel-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:3000/api
    depends_on:
      - backend

volumes:
  mongo_data:
